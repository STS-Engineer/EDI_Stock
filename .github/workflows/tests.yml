name: Offline import checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: PYTHONPATH=integration/edi_intake:. python -m unittest discover -s integration/edi_intake -v
      - run: ruff check .
      - run: python -m compileall -q App.py edi_stock
